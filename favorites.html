<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIDS.AZ - Избранное</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#081626;
color:white;
}

header{
background:#0d2238;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo-box{
width:52px;
height:52px;
background:#f4b400;
color:#081626;
font-weight:bold;
font-size:22px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.title{
font-size:42px;
margin-bottom:10px;
}

.subtitle{
opacity:.8;
margin-bottom:30px;
}

.counter{
color:#f4b400;
font-size:22px;
margin-bottom:25px;
}

.favorites{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#10253d;
padding:20px;
border-radius:15px;
}

.price{
font-size:28px;
color:#f4b400;
font-weight:bold;
margin:10px 0;
}

.buttons{
display:flex;
gap:10px;
margin-top:15px;
}

.btn{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.btn-open{
background:#f4b400;
color:#081626;
}

.btn-remove{
background:#b92d2d;
color:white;
}

.empty{
background:#10253d;
padding:40px;
border-radius:15px;
text-align:center;
display:none;
}

@media(max-width:900px){

.favorites{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="logo">

<div class="logo-box">
BA
</div>

<div>
<b>BIDS.AZ</b><br>
<small>Favorites</small>
</div>

</div>

<div>
RU | EN | AZ
</div>

</header>

<div class="container">

<h1 class="title">
❤️ Избранное
</h1>

<p class="subtitle">
Сохранённые объявления пользователя
</p>

<div class="counter" id="favoritesCount">
Найдено избранных: 0
</div>

<div class="favorites" id="favoritesContainer">
</div>

<div class="empty" id="emptyState">

<h2>
Пока нет избранных объявлений
</h2>

<br>

<p>
Добавьте первое объявление в избранное.
</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase.js"></script>

<script>
     async function removeFavorite(id){

    await supabaseClient
        .from('favorites')
        .delete()
        .eq('id', id);

    loadFavorites();
}

async function loadFavorites(){

    const container =
        document.getElementById('favoritesContainer');

    const emptyState =
        document.getElementById('emptyState');

    const counter =
        document.getElementById('favoritesCount');

    container.innerHTML = '';

    const { data: favorites, error } =
        await supabaseClient
            .from('favorites')
            .select('*');

    console.log('Favorites:', favorites);
     console.log(favorites[0]);
    console.log('Error:', error);

    if(error){
        return;
    }

    counter.innerText =
        'Найдено избранных: ' + favorites.length;

    if(favorites.length === 0){

        emptyState.style.display = 'block';

        return;
    }

    emptyState.style.display = 'none';

    for(const fav of favorites){

        const { data: listing } =
            await supabaseClient
                .from('listings')
                .select('*')
                .eq('id', fav.listing_id)
                .single();

        if(!listing){
            continue;
        }

        container.innerHTML += `
            <div class="card">

                <h3>
                    ${listing.title || 'Без названия'}
                </h3>

                <div class="price">
                    ${listing.price || '-'}
                </div>

                <p>
                    📍 ${listing.city || '-'}
                </p>

                <p>
                    👁 ${listing.views || 0} просмотров
                </p>

                <div class="buttons">

                    <button
                        class="btn btn-open">
                        Открыть
                    </button>

                    <button
                        class="btn btn-remove"
                        onclick="removeFavorite(${fav.id})">
                        Удалить
                    </button>

                </div>

            </div>
        `;
    }
}

loadFavorites();
     </script>

</body>
</html>
