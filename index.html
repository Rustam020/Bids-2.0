<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIDS.AZ V4</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#081626;
color:#fff;
}

header{
background:#0d2238;
position:sticky;
top:0;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
display:flex;
align-items:center;
gap:12px;
}

.logo-box{
width:58px;
height:58px;
border-radius:14px;
background:#f4b400;
color:#081626;
font-weight:700;
font-size:24px;
display:flex;
align-items:center;
justify-content:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:600;
}

nav a:hover{
color:#f4b400;
}

.hero{
padding:90px 20px;
text-align:center;
background:linear-gradient(135deg,#0b2a4d,#123e70);
}

.hero h1{
font-size:64px;
margin-bottom:20px;
}

.hero p{
font-size:22px;
line-height:1.8;
}

.search{
max-width:900px;
margin:35px auto;
display:flex;
gap:10px;
}

.search input{
flex:1;
padding:16px;
border:none;
border-radius:10px;
}

.search button{
background:#f4b400;
border:none;
padding:16px 24px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.btn{
background:#f4b400;
border:none;
padding:16px 24px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.btn2{
background:white;
color:#111;
}

.actions{
display:flex;
justify-content:center;
gap:15px;
}

.section{
padding:60px 40px;
}

.section h2{
margin-bottom:25px;
font-size:34px;
}

.categories{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.category{
background:#10253d;
border-radius:14px;
padding:20px;
text-align:center;
transition:.3s;
font-weight:600;
}

.category:hover{
transform:translateY(-4px);
border:1px solid #f4b400;
}
